# Save as .github/workflows/push-alerts.yml in the repository that also contains send-push.js
# Runs every 15 minutes between 07:00 and 20:45 Phnom Penh time (= 00:00-13:45 UTC) and can also be started by hand (Actions tab > Run workflow).
# GitHub may start a run 5-30 minutes late; that is normal.
name: RC date and task alerts

on:
  schedule:
    - cron: '*/15 0-13 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install web-push --no-save

      # Removes accidental spaces / new lines from the secrets and prints only their LENGTHS and a short fingerprint (never the values).
      # PUSH_SECRET length and fingerprint here must equal what checkSecret() prints in Apps Script.
      - name: Check and clean secrets
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          for n in APPS_SCRIPT_URL PUSH_SECRET VAPID_PUBLIC VAPID_PRIVATE VAPID_SUBJECT; do
            v="$(printf '%s' "${!n}" | tr -d '[:space:]')"
            echo "$n length: ${#v}"
            echo "$n=$v" >> "$GITHUB_ENV"
          done
          echo "PUSH_SECRET fingerprint: $(printf '%s' "$PUSH_SECRET" | tr -d '[:space:]' | sha256sum | cut -c1-8)"

      # The cleaned values from the step above are used automatically here.
      - run: node send-push.js

