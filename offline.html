<!DOCTYPE html>
<html lang="km"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CVC Assistant · Offline</title>
<style>
:root{--bg:#f6f3ef;--ink:#1f1b18;--mute:#7a7169;--brand:#e8641b}
@media(prefers-color-scheme:dark){:root{--bg:#131110;--ink:#f3eee8;--mute:#a39a91}}
html,body{height:100%;margin:0}body{display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Noto Sans Khmer",system-ui,sans-serif;text-align:center;padding:24px}
.i{font-size:56px}h1{font-size:1.2rem;margin:10px 0 6px}p{color:var(--mute);line-height:1.7;margin:0 0 18px}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:13px 26px;background:var(--brand);color:#fff;cursor:pointer}
</style></head><body><main>
<div class="i">📴</div>
<h1>អ្នកមិនមានអ៊ីនធឺណិត</h1>
<p>សូមភ្ជាប់អ៊ីនធឺណិត ហើយព្យាយាមម្តងទៀត។<br>You are offline. Connect to the internet and try again.</p>
<button type="button" onclick="location.reload()">ព្យាយាមម្តងទៀត / Try again</button>
</main><script>addEventListener('online',()=>location.reload())</script></body></html>
