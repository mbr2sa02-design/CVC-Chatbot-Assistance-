<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVC Assistant</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e8641b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CVC Assistant">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ed;--card:#fff;--ink:#23201d;--mute:#6b645d;--line:#e2dcd4;--brand:#e8641b;--bot:#ece6de}
@media (prefers-color-scheme:dark){:root{--bg:#1b1917;--card:#252220;--ink:#f1ece6;--mute:#a79f96;--line:#3a3532;--bot:#332e2b}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Khmer",system-ui,sans-serif;display:flex;justify-content:center;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.wrap{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;padding:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:auto 0}
h1{font-size:1.15rem;margin:0 0 4px}p.s{color:var(--mute);margin:0 0 14px;font-size:.9rem}
input{width:100%;font:inherit;padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--brand);color:#fff;padding:12px 18px;cursor:pointer}
button:disabled{opacity:.5}
.top{display:flex;align-items:center;gap:8px;padding:6px 4px 10px}.top b{flex:1}
.top button{background:none;color:var(--mute);border:1px solid var(--line);padding:6px 10px;font-weight:400}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.m{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.bot a{color:var(--brand);font-weight:600;word-break:break-all}
form.in{display:flex;gap:8px;padding-top:8px;align-items:flex-end}
form.in textarea{flex:1;font:inherit;padding:12px;margin:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:none;max-height:140px;line-height:1.4}
#mic{background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:1.4rem;line-height:1;width:52px;height:52px;padding:0;border-radius:50%;flex:none}
#mic.on{background:#c0392b;color:#fff;border-color:#c0392b;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(192,57,43,.25)}}
#rec{display:none;align-items:center;gap:8px;padding:8px 10px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bot)}
#rec span{flex:1}#rec button{padding:8px 12px;font-size:.9rem}
#rec button.x{background:none;color:var(--mute);border:1px solid var(--line);font-weight:400}
.menu{display:flex;flex-direction:column;gap:6px;white-space:normal}
.menu .mh{font-weight:600;margin-bottom:2px}
.menu button{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:400;text-align:left;padding:10px 12px;line-height:1.4}
.optrow{display:flex;flex-wrap:wrap;gap:6px;padding:2px}
.optrow button{background:var(--card);color:var(--brand);border:1px solid var(--brand);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.9rem;line-height:1.3;text-align:left}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 2px 0}
.chips button{background:none;color:var(--brand);border:1px solid var(--line);padding:6px 10px;font-weight:400;font-size:.85rem;border-radius:16px}
#err{color:#c0392b;font-size:.9rem;min-height:1.2em;margin:0 0 8px}
.hide{display:none}
.spk{display:block;margin-top:6px;padding:3px 10px;font-size:.85rem;font-weight:400;background:none;color:var(--mute);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.spk.on{background:var(--brand);color:#fff;border-color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card">
    <h1>ជំនួយការ CVC / CVC Assistant</h1>
    <p class="s">ចូលដោយប្រើគណនីដែលផ្តល់ឱ្យ / Sign in with your dashboard username and PIN</p>
    <input id="u" placeholder="ឈ្មោះអ្នកប្រើ / Username" autocomplete="username" autocapitalize="none">
    <input id="p" type="password" placeholder="កូដ PIN / PIN" autocomplete="current-password">
    <p id="err"></p>
    <button id="go" style="width:100%">ចូល / Sign in</button>
  </div>

  <div id="chat" class="hide" style="display:none;flex:1;flex-direction:column;min-height:0">
    <div class="top"><b>ជំនួយការ CVC</b><span id="who" class="s" style="margin:0"></span><button id="vol" type="button" aria-label="អានចម្លើយដោយស្វ័យប្រវត្តិ / Auto-read replies" title="Auto-read replies">🔇</button><button id="out">ចេញ / Sign out</button></div>
    <div id="log" aria-live="polite"></div>
    <div class="chips" id="chips">
      <button type="button" data-wv="1">🌍 អំពីអង្គការទស្សនៈពិភពលោក</button>
      <button type="button" data-t="ជួយសរសេរសារទៅអ្នកឧបត្ថម្ភអំពី៖ ">✍️ សរសេរសារ</button>
      <button type="button" data-t="កុមាររបស់ខ្ញុំ" data-send="1">👥 កុមាររបស់ខ្ញុំ</button>
    </div>
    <div id="rec"><span id="recmsg"></span><button type="button" id="recok">✔ បញ្ចប់</button><button type="button" id="recx" class="x">✖ បោះបង់</button></div>
    <form class="in" id="f"><textarea id="q" rows="1" autocomplete="off" placeholder="សួរ ឬបិទភ្ជាប់អត្ថបទ… / Ask or paste text…"></textarea><button type="button" id="mic" aria-label="និយាយ / Speak">🎤</button><button id="send">ផ្ញើ</button></form>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycby6lMmY6vBkCxNvjkscQVjnJYlYnPXiqPB3NMfPBuEgC9LiClKdF_rwMS833w_SPmmsTg/exec';
const $ = id => document.getElementById(id);
let token = null;
let chatHist = [];   // only general-helper turns (translate/summarize); child answers are never kept or sent back
try { token = sessionStorage.getItem('cvc_t'); } catch (e) {}

async function call(body) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ token }, body)) });
  const t = await r.text();
  try { return JSON.parse(t); } catch (e) { throw new Error('Not JSON: ' + t.slice(0, 80)); }
}
function show(chat) {
  $('login').style.display = chat ? 'none' : '';
  $('chat').style.display = chat ? 'flex' : 'none';
}
// Turns [label](https://...) into safe clickable links; everything else stays plain text.
function fill(el, text) {
  el.textContent = '';
  const re = /\[([^\]]+)\]\((https:\/\/[^)\s]+|sso:rcmon)\)/g; let i = 0, m;
  while ((m = re.exec(text))) {
    el.appendChild(document.createTextNode(text.slice(i, m.index)));
    const a = document.createElement('a'); a.textContent = m[1];
    if (m[2] === 'sso:rcmon') { a.href = '#'; a.onclick = openMonitor; }
    else { a.href = m[2]; a.target = '_blank'; a.rel = 'noopener'; }
    el.appendChild(a); i = re.lastIndex;
  }
  el.appendChild(document.createTextNode(text.slice(i)));
}
// Opens RC Monitoring already signed in: asks the server for a one-time link (valid 2 minutes).
async function openMonitor(e) {
  e.preventDefault();
  const w = window.open('', '_blank'); // opened first so phone browsers don't block it
  try {
    const d = await call({ action: 'sso' });
    if (d.ok && d.url) { if (w) w.location.href = d.url; else location.href = d.url; return; }
    throw new Error(d.message || 'failed');
  } catch (err) { if (w) w.close(); alert('Cannot open RC Monitoring. Please try again.'); }
}
function add(cls, text) {
  const d = document.createElement('div');
  d.className = 'm ' + cls; fill(d, text);
  if (cls === 'bot' && text.length > 3) addSpk(d, text);
  $('log').appendChild(d); $('log').scrollTop = 1e9; return d;
}
function signedIn(name) {
  show(true); $('who').textContent = name || '';
  if (!$('log').children.length) add('bot', 'សួស្តី! ខ្ញុំជាជំនួយការ CVC។ ខ្ញុំអាចជួយអ្នកបាន៖\n\n👤 រកព័ត៌មានកុមារ — វាយឈ្មោះ ឬលេខ RC\n👥 មើលកុមារក្នុងតំបន់របស់អ្នក — វាយឈ្មោះ CVC ឬ «កុមាររបស់ខ្ញុំ»\n📍 បើកទីតាំង និង 📋 ប្រព័ន្ធតាមដាន RC\n🎤 និយាយជំនួសការវាយ — ចុចប៊ូតុងមីក្រូហ្វូន\n🔊 ស្តាប់ចម្លើយ — ចុចប៊ូតុង 🔊 ក្រោមសារ\n🌍 ស្វែងយល់អំពីអង្គការទស្សនៈពិភពលោក — ចុចប៊ូតុងខាងក្រោម\n✍️ ជួយសរសេរ ឬកែសម្រួលសារ និងលិខិតជូនអ្នកឧបត្ថម្ភ\n💡 ពន្យល់ពាក្យ ឬឆ្លើយសំណួរទូទៅអំពីការងារ\n\nចុចប៊ូតុងខាងក្រោម ឬវាយសំណួររបស់អ្នក។\nសូមកុំបញ្ចូលព័ត៌មានផ្ទាល់ខ្លួនរបស់កុមារ ក្នុងសំណួរទូទៅ។');
}
function signOut(msg) {
  stopRec(true); stopSpeak();
  if (token) call({ action: 'logout' }).catch(() => {});
  token = null; try { sessionStorage.removeItem('cvc_t'); } catch (e) {}
  $('log').innerHTML = ''; chatHist = []; $('p').value = ''; $('err').textContent = msg || ''; show(false);
}

$('go').onclick = async () => {
  $('err').textContent = ''; $('go').disabled = true;
  try {
    const d = await call({ action: 'login', username: $('u').value, password: $('p').value, token: null });
    if (d.ok) { token = d.token; try { sessionStorage.setItem('cvc_t', token); } catch (e) {} $('p').value = ''; signedIn(d.name); }
    else $('err').textContent = d.message || 'Sign in failed.';
  } catch (e) { $('err').textContent = 'Cannot connect: ' + e.message; }
  $('go').disabled = false;
};
$('p').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
$('out').onclick = () => signOut();

$('f').onsubmit = async e => {
  e.preventDefault();
  const q = $('q').value.trim(); if (!q) return;
  stopSpeak(); unlockTts();
  const oldOpt = $('optrow'); if (oldOpt) oldOpt.remove();
  add('me', q); $('q').value = ''; $('q').style.height = 'auto'; $('send').disabled = true;
  const w = add('bot', '…');
  try {
    const d = await call({ action: 'ask', question: q, history: chatHist.slice(-6) });
    if (d.error === 'SESSION') { signOut(d.message); return; }
    const ans = d.answer || d.message || 'No answer.';
    fill(w, ans);
    if (d.options || d.choices) { showOpts(d); }                      // child answers: pills, never read aloud
    else { addSpk(w, ans); if (autoSpeak || viaMic) speak(ans); }
    viaMic = false;
    if (d.mode === 'chat') { chatHist.push({ r: 'user', t: q }, { r: 'model', t: ans }); if (chatHist.length > 12) chatHist.splice(0, chatHist.length - 12); }
  } catch (err) { w.textContent = 'Connection error. Try again.'; }
  $('send').disabled = false; $('q').focus();
};

const grow = () => { const q = $('q'); q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 140) + 'px'; };
$('q').addEventListener('input', grow);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('f').requestSubmit(); } });
$('chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.wv) { add('me', 'អំពីអង្គការទស្សនៈពិភពលោក'); wvMenu('សូមជ្រើសរើសសំណួរដែលអ្នកចង់ដឹង៖'); return; }
  $('q').value = b.dataset.t; grow(); $('q').focus();
  if (b.dataset.send) $('f').requestSubmit();
});

/* ---------------- child pills: pick what to see instead of showing everything ---------------- */
function optRow(items, onPick) {
  const old = $('optrow'); if (old) old.remove();
  const d = document.createElement('div'); d.id = 'optrow'; d.className = 'optrow';
  items.forEach(it => { const b = document.createElement('button'); b.type = 'button'; b.textContent = it.label; b.onclick = () => onPick(it); d.appendChild(b); });
  $('log').appendChild(d); $('log').scrollTop = 1e9;
}
function showOpts(d) {
  if (d.options && d.options.length) optRow(d.options, it => childAsk(d.key, it.id));
  else if (d.choices && d.choices.length) optRow(d.choices, it => childAsk(it.key, 'menu'));
}
async function childAsk(key, section) {
  stopSpeak();
  const old = $('optrow'); if (old) old.remove();
  const w = document.createElement('div'); w.className = 'm bot'; w.textContent = '…';   // no read-aloud button: child details are never spoken
  $('log').appendChild(w); $('log').scrollTop = 1e9;
  try {
    const d = await call({ action: 'child', key, section });
    if (d.error === 'SESSION') { signOut(d.message); return; }
    fill(w, d.answer || d.message || 'រកមិនឃើញទេ។');
    showOpts(d);
  } catch (err) { w.textContent = 'មានបញ្ហា សូមព្យាយាមម្តងទៀត។'; }
}

/* ---------------- About World Vision: fixed questions and answers (no server call, no Gemini quota) ---------------- */
const WV_LINK = '\n\nព័ត៌មានបន្ថែម / More: [wvi.org](https://www.wvi.org/about-us)';
const WV = [
  { q: '🌟 ចក្ខុវិស័យរបស់ទស្សនៈពិភពលោកជាអ្វី?', a: [
    '🌟 ចក្ខុវិស័យ (Vision)',
    '',
    'សម្រាប់កុមារគ្រប់រូប មានជីវិតដ៏បរិបូរណ៍។',
    '(Our vision for every child, life in all its fullness.)',
    '',
    'ការអធិស្ឋានរបស់យើង៖ សម្រាប់ដួងចិត្តគ្រប់រូប មានឆន្ទៈធ្វើឱ្យវាកើតឡើង។',
    '',
    'ចំណុចសំខាន់៖',
    '• ផ្តោតលើកុមារដែលងាយរងគ្រោះបំផុត ដើម្បីឱ្យពួកគេរួចផុតពីភាពក្រីក្រ និងមានជីវិតដ៏បរិបូរណ៍',
    '• សេចក្តីប្រាថ្នាសម្រាប់កុមារ៖ មានសុខភាពល្អ ទទួលបានការអប់រំសម្រាប់ជីវិត ទទួលបានការថែរក្សា និងការការពារ ហើយដឹងពីសេចក្តីស្រឡាញ់របស់ព្រះ និងអ្នកជិតខាង',
    '• ទស្សនៈពិភពលោកបម្រើមនុស្សគ្រប់រូប ដោយមិនប្រកាន់សាសនា ជាតិសាសន៍ ពូជសាសន៍ ឬភេទ'
  ].join('\n') + WV_LINK },
  { q: '🎯 បេសកកម្មរបស់ទស្សនៈពិភពលោកជាអ្វី?', a: [
    '🎯 បេសកកម្ម (Mission)',
    '',
    'ទស្សនៈពិភពលោកជាភាពជាដៃគូអន្តរជាតិនៃគ្រីស្ទបរិស័ទ ដែលមានបេសកកម្មដើរតាមព្រះអម្ចាស់ និងព្រះសង្គ្រោះរបស់យើង គឺព្រះយេស៊ូវគ្រីស្ទ ក្នុងការធ្វើការជាមួយអ្នកក្រីក្រ និងអ្នកត្រូវគេជិះជាន់ ដើម្បីជំរុញការផ្លាស់ប្តូរមនុស្ស ស្វែងរកយុត្តិធម៌ និងធ្វើជាសាក្សីអំពីដំណឹងល្អនៃព្រះរាជ្យរបស់ព្រះ។',
    '',

  if (!navigator.mediaDevices || !window.MediaRecorder) { recMsg('ឧបករណ៍នេះមិនគាំទ្រការថតសំឡេងទេ។ / Recording is not supported on this device.', false); setTimeout(recHide, 4000); return; }
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { recMsg('សូមអនុញ្ញាតឱ្យប្រើមីក្រូហ្វូន ក្នុងការកំណត់កម្មវិធីរុករក។ / Please allow the microphone.', false); setTimeout(recHide, 5000); return; }
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
  const mt = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
  mr = mt ? new MediaRecorder(stream, { mimeType: mt }) : new MediaRecorder(stream);
  chunks = []; cancelled = false;
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = onRecStop;
  mr.start(); t0 = Date.now();
  $('mic').classList.add('on'); $('mic').textContent = '⏹'; $('send').disabled = true;
  const upd = () => {
    const s = Math.floor((Date.now() - t0) / 1000);
    recMsg('🔴 កំពុងថត… ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' — និយាយបានហើយ ចុច «បញ្ចប់»', true);
    if (s >= MAXSEC) stopRec(false);
  };
  upd(); tick = setInterval(upd, 500);
}
function stopRec(cancel) {
  cancelled = !!cancel; clearInterval(tick); tick = null;
  if (mr && mr.state !== 'inactive') { try { mr.stop(); } catch (e) {} }
  else if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (cancel) { recHide(); $('mic').classList.remove('on'); $('mic').textContent = '🎤'; $('send').disabled = false; }
}
async function onRecStop() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('mic').classList.remove('on'); $('mic').textContent = '🎤';
  if (cancelled || !chunks.length) { recHide(); $('send').disabled = false; return; }
  recMsg('⏳ កំពុងបម្លែងសំឡេងទៅជាអក្សរ… / Converting your voice to text…', false);
  try {
    const wav = await blobToWav16k(new Blob(chunks, { type: (mr && mr.mimeType) || 'audio/webm' }));
    const d = await call({ action: 'transcribe', audio: b64(wav) });
    if (d.error === 'SESSION') { signOut(d.message); return; }
    const txt = (d.text || '').trim();
    if (txt) {
      const q = $('q'); q.value = (q.value ? q.value.trim() + ' ' : '') + txt; viaMic = true; grow(); q.focus(); recHide();
    } else { recMsg('មិនឮច្បាស់ទេ សូមនិយាយម្តងទៀត។ / Could not hear clearly. Please try again.', false); setTimeout(recHide, 4000); }
  } catch (e) { recMsg('មានបញ្ហា សូមព្យាយាមម្តងទៀត។ / Something went wrong. Please try again.', false); setTimeout(recHide, 4000); }
  $('send').disabled = false;
}
$('mic').onclick = () => { if (mr && mr.state === 'recording') stopRec(false); else startRec(); };
$('recok').onclick = () => stopRec(false);
$('recx').onclick = () => stopRec(true);

/* ---------------- read aloud: uses the phone's built-in voice; the text is NOT sent to any server ---------------- */
const TTS = 'speechSynthesis' in window;
let autoSpeak = false, viaMic = false, voices = [], ttsWarned = false, curBtn = null;
try { autoSpeak = localStorage.getItem('cvc_auto') === '1'; } catch (e) {}
function loadVoices() { voices = TTS ? speechSynthesis.getVoices() : []; }
if (TTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const isKm = s => (s.match(/[\u1780-\u17FF]/g) || []).length > s.replace(/\s/g, '').length * 0.3;
function speakable(t) {
  return t.replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/https?:\/\/\S+/g, '')
    .replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u2022\u2192]/gu, ' ')
    .replace(/\s[\u2014\u2013]\s/g, ', ').replace(/[|*_#>]+/g, ' ');
}
function splitSpeech(t) {
  const out = [];
  const cut = s => { while (s.length > 200) { let i = s.lastIndexOf(' ', 200); if (i < 60) i = 200; out.push(s.slice(0, i).trim()); s = s.slice(i); } if (s.trim()) out.push(s.trim()); };
  t.split(/\n+/).forEach(line => { (line.match(/[^\u17D4.!?]+[\u17D4.!?]*/g) || []).forEach(s => { if (s.trim()) cut(s.trim()); }); });
  return out.filter(s => /[\p{L}\p{N}]/u.test(s));
}
function pickVoice(km) {
  const w = km ? 'km' : 'en', norm = v => v.lang.toLowerCase().replace('_', '-');
  return voices.find(v => norm(v).startsWith(w + '-')) || voices.find(v => norm(v).startsWith(w)) || null;
}
function unlockTts() { try { if (TTS) speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {} }  // lets iPhone speak later
function stopSpeak() { try { if (TTS) speechSynthesis.cancel(); } catch (e) {} if (curBtn) { curBtn.classList.remove('on'); curBtn = null; } }
function speak(text, btn) {
  if (!TTS) { recMsg('ឧបករណ៍នេះមិនគាំទ្រការអានសំឡេងទេ។ / Reading aloud is not supported on this device.', false); setTimeout(recHide, 4000); return; }
  stopSpeak(); loadVoices();
  const parts = splitSpeech(speakable(text)); let skipped = false, last = null;
  parts.forEach(p => {
    const km = isKm(p), v = pickVoice(km);
    if (km && !v) { skipped = true; return; }
    const u = new SpeechSynthesisUtterance(p); u.lang = km ? 'km-KH' : 'en-US'; u.rate = 0.95; if (v) u.voice = v;
    speechSynthesis.speak(u); last = u;
  });
  if (btn && last) { curBtn = btn; btn.classList.add('on'); last.onend = last.onerror = () => { if (curBtn === btn) { btn.classList.remove('on'); curBtn = null; } }; }
  if (skipped && !ttsWarned) {
    ttsWarned = true;
    recMsg('ទូរស័ព្ទនេះមិនមានសំឡេងខ្មែរទេ។ សូមដំឡើង «Speech Services by Google» ហើយទាញយកសំឡេងខ្មែរ។ / No Khmer voice on this phone. Install Google Speech Services and download the Khmer voice.', false);
    setTimeout(recHide, 9000);
  }
}
function addSpk(el, text) {
  if (!TTS) return;
  const b = document.createElement('button'); b.type = 'button'; b.className = 'spk'; b.textContent = '🔊 ស្តាប់ / Listen';
  b.onclick = () => { if (curBtn === b) stopSpeak(); else speak(text, b); };
  el.appendChild(b);
}
$('vol').textContent = autoSpeak ? '🔊' : '🔇';
$('vol').onclick = () => {
  autoSpeak = !autoSpeak; $('vol').textContent = autoSpeak ? '🔊' : '🔇';
  try { localStorage.setItem('cvc_auto', autoSpeak ? '1' : '0'); } catch (e) {}
  if (autoSpeak) unlockTts(); else stopSpeak();
};

if (token) signedIn('');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
