<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVC Assistant</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e8641b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CVC Assistant">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ef;--bg2:#fff4ea;--card:#fff;--ink:#1f1b18;--mute:#7a7169;--line:#ece5dd;--brand:#e8641b;--brand2:#f58a3c;--bot:#fff;--glass:rgba(255,255,255,.82);--ok:#22a06b;--shadow:0 1px 2px rgba(31,27,24,.06),0 8px 24px rgba(31,27,24,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#131110;--bg2:#1d1815;--card:#1f1b19;--ink:#f3eee8;--mute:#a39a91;--line:#342f2b;--bot:#2a2522;--glass:rgba(31,27,25,.82);--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:radial-gradient(1100px 520px at 50% -12%,var(--bg2),var(--bg));color:var(--ink);font-family:"Noto Sans Khmer","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding-top:env(safe-area-inset-top)}
.wrap{width:100%;max-width:720px;height:100%;display:flex;flex-direction:column}
button{font:inherit;font-weight:600;border:0;background:var(--brand);color:#fff;cursor:pointer}button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
/* login */
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px 22px 24px;margin:auto 14px;box-shadow:var(--shadow);text-align:center}
.logo,.av{background:linear-gradient(135deg,var(--brand2),var(--brand));display:grid;place-items:center;color:#fff}
.logo{width:104px;height:104px;border-radius:32px;margin:0 auto 14px;font-size:32px;box-shadow:0 12px 26px rgba(232,100,27,.35)}
h1{font-size:1.25rem;margin:0 0 6px}p.s{color:var(--mute);margin:0 0 20px;font-size:.88rem;line-height:1.6}
.fld{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:10px;text-align:left}
.fld:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(232,100,27,.15)}
.fld input{border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:14px 0;width:100%}
#err{color:#d23b2a;font-size:.88rem;min-height:1.3em;margin:2px 0 10px}
#go{width:100%;border-radius:14px;padding:14px;font-weight:700;background:linear-gradient(135deg,var(--brand2),var(--brand));box-shadow:0 10px 22px rgba(232,100,27,.3)}
/* chat shell */
#chat{background:transparent}
.top{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:relative;z-index:2}
.av{width:48px;height:48px;border-radius:50%;font-size:20px;flex:none;box-shadow:0 6px 14px rgba(232,100,27,.3)}
.ttl{flex:1;min-width:0}.ttl b{display:block;font-size:1.02rem;line-height:1.3}
.ttl small{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(34,160,107,.2);flex:none}
#who:empty::before{content:"World Vision Cambodia"}
.ib{width:40px;height:40px;border-radius:50%;padding:0;background:transparent;color:var(--mute);border:1px solid var(--line);font-size:1.05rem;display:grid;place-items:center;flex:none}
.ib:hover{border-color:var(--brand);color:var(--brand)}.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:18px 14px 8px;scroll-behavior:smooth;scrollbar-width:thin}
.m{max-width:84%;padding:11px 15px;border-radius:20px;line-height:1.65;font-size:.97rem;white-space:pre-wrap;overflow-wrap:anywhere;animation:pop .24s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.me{align-self:flex-end;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;border-bottom-right-radius:6px;box-shadow:0 6px 16px rgba(232,100,27,.25)}
.bot{align-self:flex-start;position:relative;margin-left:38px;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.bot::before{content:"";position:absolute;left:-38px;bottom:0;width:30px;height:30px;border-radius:50%;background:var(--avimg) center/cover no-repeat,linear-gradient(135deg,var(--brand2),var(--brand));box-shadow:0 2px 6px rgba(232,100,27,.3)}
.bot a{color:var(--brand);font-weight:700;word-break:break-all;text-decoration:none;border-bottom:1.5px solid rgba(232,100,27,.35)}
.m.typing{font-size:0;min-width:70px;padding:10px 16px;display:flex;align-items:center;justify-content:center}
.m.typing::after{content:"•••";font-size:22px;letter-spacing:4px;line-height:1;color:var(--mute);animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.spk,.cpy{display:inline-flex;align-items:center;gap:4px;margin-top:8px;padding:5px 12px;font-size:.82rem;font-weight:500;background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:999px}
.spk.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.spk+.cpy{margin-left:6px}.spk.fb{margin-left:6px}.spk.fb.sel{background:var(--brand);color:#fff;border-color:var(--brand)}.cpy{-webkit-user-select:none;user-select:none}
/* everything in the chat can be selected and copied */
.m,.m *,#cpan,#cpan *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.m button,.m .cpy{-webkit-user-select:none;user-select:none}
.menu{display:flex;flex-direction:column;gap:8px;white-space:normal}.menu .mh{font-weight:700;margin-bottom:2px}
.menu button{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500;text-align:left;padding:11px 14px;line-height:1.45;border-radius:14px}
.menu button:hover{border-color:var(--brand)}
.optrow{display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 2px 38px;animation:pop .24s ease-out both}
.optrow button{background:var(--card);color:var(--brand);border:1px solid rgba(232,100,27,.4);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.87rem;line-height:1.35;text-align:left;box-shadow:var(--shadow)}
.optrow button:hover{background:rgba(232,100,27,.08)}
.optrow button.act{background:rgba(232,100,27,.1);color:var(--ink);border:1px solid var(--line);border-radius:14px;font-weight:600}
/* human avatar: alive (blinks, breathes, pulses online ring, mouth moves while speaking) */
.logo svg,.av svg{width:100%;height:100%;display:block;border-radius:inherit}
.av{position:relative}
/* 3D robot: floats, tilts, blinks, glows, waves, eyes follow the pointer, mouth + ears move when talking/listening */
.robot{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.head{transform-origin:100px 126px;animation:tilt 5s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.shadow{transform-box:fill-box;transform-origin:center;animation:shd 3s ease-in-out infinite}@keyframes shd{50%{transform:scale(.8);opacity:.15}}
.eye{transform-box:fill-box;transform-origin:center;animation:lid 3.8s infinite}@keyframes lid{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.eyes{transition:transform .12s ease-out}
.mouth{transform-box:fill-box;transform-origin:50% 0}
.talk .mouth{animation:talk .28s ease-in-out infinite alternate}@keyframes talk{to{transform:scaleY(2.1)}}
.ball,.led{animation:glow 2s ease-in-out infinite}@keyframes glow{50%{opacity:.45}}
.heart{transform-box:fill-box;transform-origin:center;animation:beat 1.2s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.3)}}
.ear{transform-box:fill-box;transform-origin:center}
.talk .ear,.listen .ear{animation:earp .45s ease-in-out infinite alternate}@keyframes earp{to{transform:scaleY(1.18)}}
.think .ball{animation:glow .45s infinite}.think .eyes{animation:scan 1.1s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.arm{transform-origin:152px 142px}.wave .arm{animation:wave 1.5s ease-in-out}
@keyframes wave{0%,100%{transform:rotate(0)}12%{transform:rotate(-140deg)}28%{transform:rotate(-110deg)}44%{transform:rotate(-140deg)}60%{transform:rotate(-110deg)}76%{transform:rotate(-140deg)}}
.av::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);opacity:0;animation:ring 2.6s ease-out infinite;pointer-events:none}
.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}
@keyframes ring{0%{transform:scale(.88);opacity:.55}100%{transform:scale(1.2);opacity:0}}
#st::after{content:" · "}#st.tp::after{content:"… · "}
/* titled data (child details): Title / Label : value */
.m.kvm{white-space:normal}
.kvm .kt{font-weight:700;color:var(--brand);margin:12px 0 4px;font-size:.95rem}.kvm .kt:first-child{margin-top:0;font-size:1.06rem;color:var(--ink)}.kvm .kt:nth-child(2){padding-top:8px;border-top:1px solid var(--line)}
.kvm .kr{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:2px 12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kvm .kr:last-child{border-bottom:0}
.kvm .kk{color:var(--mute);font-size:.84rem;font-weight:600}.kvm .kvv{overflow-wrap:anywhere}
.kvm .kp{margin:4px 0}
.kvm table{border-collapse:collapse;width:100%;font-size:.88rem;display:block;overflow-x:auto;margin:6px 0}
.kvm th{background:rgba(232,100,27,.1);text-align:left;padding:6px 8px;white-space:nowrap}
.kvm td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
/* calendar */
#cal{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}#cal.on{display:flex}
.ch{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.ch b{flex:1;min-width:0;font-size:1.02rem;line-height:1.35}.ch small{display:block;font-weight:400;color:var(--mute);font-size:.72rem}
.ch button{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;min-width:38px;height:38px;padding:0 9px;font-size:.88rem}
.cb{flex:1;overflow-y:auto}.cg{display:grid;grid-template-columns:repeat(7,1fr)}
.cw{background:#0a9b1f;color:#fff;text-align:center;padding:7px 0;font-weight:600;font-size:.82rem}
.cd{min-height:66px;border:.5px solid var(--line);padding:3px 2px;text-align:center;background:var(--card);cursor:pointer;overflow:hidden;font-size:.68rem;color:var(--mute)}
.cd.o{opacity:.4}.cd.su{background:#0aa21d;color:#eaffee}.cd.sel{outline:2px solid var(--brand);outline-offset:-2px}
.cd .n{display:inline-block;min-width:24px;font-size:1rem;font-weight:700;color:var(--ink);border-radius:12px}.cd.ev .n{color:#1a4fd6}.cd.ph .n{color:#d23b2a}.cd.su .n{color:#fff}.cd.td .n{background:var(--brand);color:#fff}
.pl{display:none;margin-top:2px;padding:1px 4px;border-radius:4px;font-size:.68rem;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.h{background:#ffd9dc;color:#c0281b}.pl.o{background:#dbe4ff;color:#1a3fd0}.pl.p{background:#fff0c2;color:#7a5200}
.dots{display:flex;gap:3px;justify-content:center;margin-top:3px}.dots i{width:6px;height:6px;border-radius:50%;background:#1a4fd6}.dots i.h{background:#d23b2a}.dots i.p{background:#e0a100}
@media(min-width:720px){.cd{min-height:100px}.cd .pl{display:block}.dots{display:none}}
.cp{padding:12px 14px calc(18px + env(safe-area-inset-bottom))}.pt{font-weight:700;margin-bottom:8px;line-height:1.6}
.pr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}.pr span{flex:1}.pr.dn span{text-decoration:line-through;opacity:.55}
.pr button{background:transparent;color:var(--mute);padding:4px 8px}.pr .pl{display:block;font-size:.88rem;padding:4px 8px;white-space:normal}
.af{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.af input,.af select{border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--card);color:var(--ink);font:inherit;min-width:0}#pt{flex:1 1 100%}.af button{border-radius:10px;padding:9px 14px;margin-left:auto}
/* quick chips + input */
.chips{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding:8px 14px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:500;font-size:.86rem;white-space:nowrap;box-shadow:var(--shadow)}
.chips button:hover{border-color:var(--brand)}
#rec{display:none;align-items:center;gap:8px;padding:9px 12px;margin:6px 14px 0;border:1px solid var(--line);border-radius:16px;background:var(--bot);box-shadow:var(--shadow)}
#rec span{flex:1;font-size:.9rem}#rec button{padding:8px 14px;font-size:.88rem;border-radius:999px}
#rec button.x{background:none;color:var(--mute);border:1px solid var(--line);font-weight:500}
form.in{padding:8px 14px calc(12px + env(safe-area-inset-bottom));margin:0}
.box{display:flex;align-items:flex-end;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:6px 6px 6px 18px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(232,100,27,.15)}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;resize:none;max-height:140px;line-height:1.5;padding:9px 0}
#mic{width:42px;height:42px;border-radius:50%;padding:0;background:transparent;color:var(--brand);line-height:1;flex:none;display:grid;place-items:center}
#mic svg{width:24px;height:24px;display:block}
#mic:hover{background:rgba(232,100,27,.1)}
#mic.on{background:#d23b2a;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(210,59,42,.22)}}
#send{width:42px;height:42px;border-radius:50%;padding:0;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand2),var(--brand));box-shadow:0 6px 14px rgba(232,100,27,.32)}
#send svg{width:19px;height:19px;fill:#fff}
.hide{display:none}
@media (min-width:760px){body{padding:20px}.wrap{max-width:760px}#chat{background:var(--glass);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}.top{border-radius:28px 28px 0 0}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;scroll-behavior:auto !important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card">
    <div class="logo" data-av></div>
    <h1>ជំនួយការ CVC</h1>
    <p class="s">ចូលដោយប្រើឈ្មោះអ្នកប្រើ និងកូដ PIN របស់អ្នក<br>Sign in with your dashboard username and PIN</p>
    <label class="fld"><span>👤</span><input id="u" placeholder="ឈ្មោះអ្នកប្រើ / Username" autocomplete="username" autocapitalize="none"></label>
    <label class="fld"><span>🔒</span><input id="p" type="password" placeholder="កូដ PIN / PIN" autocomplete="current-password"></label>
    <p id="err"></p>
    <button id="go">ចូល / Sign in</button>
  </div>

  <div id="chat" class="hide" style="display:none;flex:1;flex-direction:column;min-height:0">
    <div class="top">
      <div class="av" data-av></div>
      <div class="ttl"><b>ជំនួយការ CVC</b><small><i class="dot"></i><span id="st">កំពុងសកម្ម</span><span id="who"></span></small></div>
      <button id="calb" class="ib" type="button" aria-label="ប្រតិទិន / Calendar" title="ប្រតិទិន / Calendar">📅</button>
      <button id="vol" class="ib" type="button" aria-label="អានចម្លើយដោយស្វ័យប្រវត្តិ / Auto-read replies" title="Auto-read replies">🔇</button>
      <button id="out" class="ib" type="button" aria-label="ចេញ / Sign out" title="ចេញ / Sign out"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
    <div id="log" aria-live="polite"></div>
    <div class="chips" id="chips">
      <button type="button" data-cal="1">📅 ប្រតិទិន</button>
      <button type="button" data-wv="1">🌍 អំពីអង្គការទស្សនៈពិភពលោក</button>
      <button type="button" data-cp="1">🛡️ ការការពារកុមារ · Do &amp; Don’t</button>
      <button type="button" data-t="កុមាររបស់ខ្ញុំ" data-send="1">👥 កុមាររបស់ខ្ញុំ</button>
    </div>
    <div id="rec"><span id="recmsg"></span><button type="button" id="recok">✔ បញ្ចប់</button><button type="button" id="recx" class="x">✖ បោះបង់</button></div>
    <form class="in" id="f"><div class="box"><textarea id="q" rows="1" autocomplete="off" placeholder="សួរ ឬបិទភ្ជាប់អត្ថបទ… / Ask or paste text…"></textarea><button type="button" id="mic" aria-label="ថតសំឡេង / Record voice" title="ថតសំឡេង / Record voice"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 15.5a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5.5a4 4 0 0 0 4 4z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.2"/></svg></button><button id="send" aria-label="ផ្ញើ / Send"><svg viewBox="0 0 24 24"><path d="M3.4 20.4 21 12 3.4 3.6 3.3 10l12.5 2-12.5 2z"/></svg></button></div></form>
  </div>
</div>

<div id="cal"><div class="ch"><button id="cx" type="button">✕</button><button id="cpv" type="button">‹</button><button id="cnx" type="button">›</button><b id="ct"></b><button id="ctd" type="button">ថ្ងៃនេះ</button><button id="cbell" type="button">🔕</button></div><div class="cb"><div class="cg" id="cgh"></div><div class="cg" id="cgd"></div><div class="cp" id="cpan"></div></div></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwyimcAYomqKAVvOnHPCAgJ6ueI5TJ4XWl8nCOhk0LPN7sQX16gK8MTfNovcWsrko3TNA/exec';
const $ = id => document.getElementById(id);
let token = null;
let chatHist = [];   // only general-helper turns (translate/summarize); child answers are never kept or sent back

async function call(body, ms) {
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), ms || 30000);   // Apps Script cold starts can be slow
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ token }, body)), signal: ac.signal });
    const t = await r.text();
    try { return JSON.parse(t); } catch (e) { console.error('Bad server response:', t.slice(0, 200)); throw new Error('BAD_RESPONSE'); }
  } finally { clearTimeout(tm); }
}
const NETMSG = e => (e && e.name === 'AbortError')

// Turns [label](https://...) into safe clickable links; everything else stays plain text.
function link(parent, text) {
  const re = /\[([^\]]+)\]\((https:\/\/[^)\s]+|sso:rcmon)\)/g; let i = 0, m;
  while ((m = re.exec(text))) {
    parent.appendChild(document.createTextNode(text.slice(i, m.index)));
    const a = document.createElement('a'); a.textContent = m[1];
    if (m[2] === 'sso:rcmon') { a.href = '#'; a.onclick = openMonitor; }
    else { a.href = m[2]; a.target = '_blank'; a.rel = 'noopener'; }
    parent.appendChild(a); i = re.lastIndex;
  }
  parent.appendChild(document.createTextNode(text.slice(i)));
}
function fill(el, text) { el.classList.remove('typing'); el.textContent = ''; link(el, text); }
// Child details: shows a TITLE for each part and "Label  value" rows (also draws | tables with header cells).
function fmt(el, text) {
  const lines = String(text).split('\n'), out = document.createDocumentFragment();
  const kvre = /^[\s•\-–*]*([^:：៖|]{1,45}?)\s*[:：៖]\s+(\S.*)$/, ttre = /^[\s#*]*(.{1,60}?)\s*[:：៖]\s*\**$/;
  let n = 0, rows = null;
  const flush = () => {
    if (!rows) return;
    const t = document.createElement('table'), hasHead = rows.head;
    const mk = (cells, tag) => { const tr = document.createElement('tr'); cells.forEach(c => { const x = document.createElement(tag); link(x, c); tr.appendChild(x); }); t.appendChild(tr); };
    if (hasHead) mk(rows.head, 'th'); rows.body.forEach(r => mk(r, 'td'));
    out.appendChild(t); rows = null; n++;
  };
  lines.forEach(raw => {
    const ln = raw.trim();
    if (!ln) { flush(); return; }
    if (/^[\s|:\-]+$/.test(ln) && ln.includes('-')) { if (rows && !rows.head && rows.body.length === 1) { rows.head = rows.body.shift(); } return; }
    if ((ln.match(/\|/g) || []).length >= 2) {
      const cells = ln.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      if (!rows) rows = { head: null, body: [] }; rows.body.push(cells); return;
    }
    flush();
    let m;
    if ((m = ln.match(kvre))) {
      const r = document.createElement('div'); r.className = 'kr';
      const k = document.createElement('div'); k.className = 'kk'; k.textContent = m[1].replace(/\*+/g, '');
      const v = document.createElement('div'); v.className = 'kvv'; link(v, m[2].replace(/\*+/g, ''));
      r.append(k, v); out.appendChild(r); n++;
    } else if ((m = ln.match(ttre)) || (/^\p{Extended_Pictographic}/u.test(ln) && ln.length <= 60)) {
      const t = document.createElement('div'); t.className = 'kt'; link(t, (m ? m[1] : ln).replace(/\*+/g, '')); out.appendChild(t); n++;
    } else { const p = document.createElement('div'); p.className = 'kp'; link(p, ln); out.appendChild(p); }
  });
  flush();
  if (!n) { fill(el, text); addCopy(el); return; }
  el.classList.remove('typing'); el.textContent = ''; el.classList.add('kvm'); el.appendChild(out); addCopy(el);
}

}

function signOut(msg) {

  token = null; try { sessionStorage.removeItem('cvc_t'); sessionStorage.removeItem('cvc_u'); } catch (e) {}
  Object.keys(KID).forEach(k => delete KID[k]);   // child details cached for the pills must not outlive the session
  try { PLS = []; PK = null; } catch (e) {}   // plans stay on the device under this user's key, but are cleared from the screen
  $('log').innerHTML = ''; chatHist = []; $('p').value = ''; $('err').textContent = msg || ''; show(false);
}

/* ---------------- child pills: pick what to see instead of showing everything ---------------- */
function optRow(items, onPick, actions, key) {
  const old = $('optrow'); if (old) old.remove();
  const d = document.createElement('div'); d.id = 'optrow'; d.className = 'optrow';
  items.forEach(it => { const b = document.createElement('button'); b.type = 'button'; b.textContent = it.label; b.onclick = () => onPick(it); d.appendChild(b); });
  (actions || []).forEach(a => {   // Location + RCM Form (Report / Close)
    const b = document.createElement('button'); b.type = 'button'; b.className = 'act'; b.textContent = a.label;
    b.onclick = a.url ? () => window.open(a.url, '_blank', 'noopener') : () => openRcm(key, a.rcm);
    d.appendChild(b);
  });
  $('log').appendChild(d); $('log').scrollTop = 1e9;
}
const KID = {};   // child key -> first reply (all sections), so tapping a pill needs no server call
function showOpts(d) {
  if (d.key && d.sections) KID[d.key] = d;
  if (d.options && d.options.length) optRow(d.options, it => childAsk(d.key, it.id), d.actions, d.key);
  else if (d.choices && d.choices.length) optRow(d.choices, it => childAsk(it.key, 'menu'));
}
// Opens the dashboard's RCM form for this child, already signed in (one-time link, valid 2 minutes).
async function openRcm(key, type) {
  const w = window.open('', '_blank');   // opened first so phone browsers don't block it
  try {
    const d = await call({ action: 'sso', target: 'rcm', key, type });
    if (d.ok && d.url) { if (w) w.location.href = d.url; else location.href = d.url; return; }
    throw new Error(d.message || 'failed');
  } catch (err) { if (w) w.close(); alert('មិនអាចបើកទម្រង់ RCM បានទេ សូមព្យាយាមម្តងទៀត។\nCannot open the RCM form. Please try again.'); }
}
async function childAsk(key, section) {
  stopSpeak();
  const old = $('optrow'); if (old) old.remove();
  const kid = KID[key];
  if (kid && kid.sections && kid.sections[section]) {   // instant: already on the phone
    const m = document.createElement('div'); m.className = 'm bot'; $('log').appendChild(m);
    fmt(m, kid.sections[section]); showOpts(kid); return;
  }
  const w = document.createElement('div'); w.className = 'm bot'; w.textContent = '…';   // no read-aloud button: child details are never spoken
  $('log').appendChild(w); $('log').scrollTop = 1e9; setBusy(true);
  try {
    const d = await call({ action: 'child', key, section });
    if (d.error === 'SESSION') { signOut(d.message); return; }
    fmt(w, d.answer || d.message || 'រកមិនឃើញទេ។');
    showOpts(d);
  } catch (err) { console.error(err); w.textContent = NETMSG(err); }
  setBusy(false);
}

function wvMenu(title) {
  const old = $('wvmenu'); if (old) old.remove();
  const d = document.createElement('div'); d.id = 'wvmenu'; d.className = 'm bot menu';
  const h = document.createElement('div'); h.className = 'mh'; h.textContent = title; d.appendChild(h);
  WV.forEach(it => { const b = document.createElement('button'); b.type = 'button'; b.textContent = it.q; b.onclick = () => wvShow(it); d.appendChild(b); });
  $('log').appendChild(d); $('log').scrollTop = 1e9;
}
function wvShow(it) {
  add('me', it.q);
  const a = add('bot', it.a);
  wvMenu('ចង់ដឹងអ្វីទៀត?');
  a.scrollIntoView({ block: 'start' });
}

/* ---------------- copy: every answer gets a Copy button; text is also selectable ---------------- */
function textOf(el) {
  let out = '';
  const walk = n => n.childNodes.forEach(c => {
    if (c.nodeType === 3) { out += c.nodeValue; return; }
    if (c.nodeType !== 1 || c.classList.contains('spk') || c.classList.contains('cpy')) return;
    if (c.tagName === 'A') { const h = c.getAttribute('href'); out += c.textContent + (h && /^https?:/.test(h) ? ' (' + h + ')' : ''); return; }
    if (c.classList.contains('kr')) { out += c.children[0].textContent + ': '; walk(c.children[1]); out += '\n'; return; }
    if (c.tagName === 'TABLE') { c.querySelectorAll('tr').forEach(r => { out += Array.from(r.children).map(x => x.textContent).join('\t') + '\n'; }); return; }
    if (c.classList.contains('kt') || c.classList.contains('kp')) { walk(c); out += '\n'; return; }
    walk(c);
  });
  walk(el);
  return out.replace(/\n{3,}/g, '\n\n').trim();
}

    try {

      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length); ok = document.execCommand('copy'); ta.remove();
    } catch (e2) {}
  }

  btn.textContent = ok ? '✔ បានចម្លង / Copied' : '⚠️ ចម្លងមិនបាន / Failed';
  setTimeout(() => { btn.textContent = old; }, 1600);
}

  h+='<div class="cd'+(D.getMonth()!==m-1?' o':'')+(D.getDay()==0?' su':'')+(id===TD?' td':'')+(id===sel?' sel':'')+(ph?' ph':ev.length?' ev':'')+'" data-d="'+id+'"><span class="n">'+D.getDate()+'</span>'+(hy?'🧘':'')+'<div>'+KH(k.day)+' '+(k.moonPhase?'រោច':'កើត')+'</div>'+(k.day==14&&!hy?'<div>ថ្ងៃកោរ</div>':'')+ev.slice(0,2).map(e=>'<div class="pl '+c(e)+'">'+E(e.n)+'</div>').join('')+'<div class="dots">'+ev.map(e=>'<i class="'+c(e)+'"></i>').join('')+'</div></div>'}
 $('cgd').innerHTML=h;panel()}
function panel(){const a=sel.split('-').map(Number),ev=hol(a[0])[sel]||[],ps=PLS.filter(p=>p.d===sel).sort((x,z)=>(x.t||'').localeCompare(z.t||''));
 $('cpan').innerHTML='<div class="pt">'+E(MKH.format(MKH.fromGregorian(a[0],a[1],a[2])))+' ត្រូវនឹង ថ្ងៃទី'+KH(a[2])+' ខែ'+SM[a[1]-1]+' ឆ្នាំ'+KH(a[0])+'</div>'
 +ev.map(e=>'<div class="pr"><span class="pl '+(e.p?'h':'o')+'">'+E(e.n)+'</span></div>').join('')
 +ps.map(p=>'<div class="pr'+(p.done?' dn':'')+'"><input type="checkbox" data-a="ck" data-i="'+p.id+'"'+(p.done?' checked':'')+'><span>'+(p.t?p.t+' · ':'')+E(p.title)+'</span><button type="button" data-a="rm" data-i="'+p.id+'">✕</button></div>').join('')
 +'<div class="af"><input id="pt" placeholder="គម្រោង / Plan…"><input id="ptm" type="time"><select id="pl"><option value="0">ពេលដល់ម៉ោង</option><option value="10">មុន ១០ នាទី</option><option value="30">មុន ៣០ នាទី</option><option value="60">មុន ១ ម៉ោង</option><option value="1440">មុន ១ ថ្ងៃ</option></select><button type="button" data-a="add">＋ បន្ថែម</button></div>'}
$('cal').addEventListener('click',e=>{const t=e.target.closest('[data-d],[data-a]');if(!t)return;
 if(t.dataset.d){sel=t.dataset.d;const a=sel.split('-');cy=+a[0];cm=+a[1];draw();return}
 const a=t.dataset.a,id=t.dataset.i;
 if(a=='add'){const ti=$('pt').value.trim();if(!ti)return;const p={id:Date.now().toString(36),d:sel,t:$('ptm').value,title:ti,l:+$('pl').value,done:0,a:0};p.a=due(p)<=Date.now()?1:0;PLS.push(p);savePl();draw()}
 if(a=='rm'){PLS=PLS.filter(p=>p.id!==id);savePl();draw()}
 if(a=='ck'){const p=PLS.find(p=>p.id===id);if(p){p.done=t.checked?1:0;savePl();draw()}}});
$('cgh').innerHTML=WK.map(w=>'<div class="cw">'+w+'</div>').join('');
$('cpv').onclick=()=>{if(--cm<1){cm=12;cy--}draw()};$('cnx').onclick=()=>{if(++cm>12){cm=1;cy++}draw()};
$('ctd').onclick=()=>{const T=new Date();cy=T.getFullYear();cm=T.getMonth()+1;sel=TD=isoD(T);draw()};
$('cx').onclick=()=>$('cal').classList.remove('on');
$('cbell').onclick=()=>{if('Notification' in window)Notification.requestPermission().then(draw);else alert('This browser has no notifications. Alerts will still appear in the chat.')};
function openCal(){$('cal').classList.add('on');$('ctd').click()}
$('calb').onclick=openCal;
</script>
