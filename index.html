<style>
:root{--bg:#f1f3f5;--card:#fff;--ink:#1f2937;--mut:#667085;--pri:#107c41;--pri2:#0b5a2f;--prib:#e7f3ec;--line:#d9dee4;--grid:#e3e7eb;--ok:#1b7f4b;--warn:#a85d00;--err:#b3261e;--okbg:#e6f4ec;--warnbg:#fff3df;--errbg:#fde8e6;--acc:#e8710a;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 'Noto Sans Khmer','Inter','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
header{background:linear-gradient(180deg,#128a49,#0e6f3a);color:#fff;padding:10px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:10px;background:#fff;color:var(--pri);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2);flex:none}.logo .ic{width:22px;height:22px}
header h1{font-size:17px;margin:0;font-weight:700;line-height:1.3}.bt small{color:#c9ebd7;font-size:12.5px}
.hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hf{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:0 8px;color:#fff}
.hf:focus-within{background:rgba(255,255,255,.24)}
.hf select,.hf input{background:transparent;border:0;color:#fff;padding:7px 2px;max-width:170px;box-shadow:none!important;outline:0}
.hf input::placeholder{color:#c9ebd7}.hf option{color:#1f2937}
nav{display:flex;gap:2px;overflow-x:auto;background:#e9ecef;border-bottom:1px solid var(--line);padding:6px 12px 0;position:sticky;top:0;z-index:5}
nav button{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px 8px 0 0;background:none;padding:10px 16px;font:inherit;color:#475467;cursor:pointer;border-top:3px solid transparent;white-space:nowrap;transition:background .15s}
nav button:hover{background:rgba(255,255,255,.65)}
nav button.on{background:#fff;color:var(--pri);border-top-color:var(--pri);font-weight:700;box-shadow:0 -1px 4px rgba(16,24,40,.08)}
main{max-width:1400px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.card h2,.card h3{margin:0 0 12px;display:flex;align-items:center;gap:10px;color:#101828}
.card h2{font-size:17px;padding-bottom:12px;border-bottom:1px solid var(--grid)}.card h3{font-size:15px}
.card h2>.ic:first-child{width:32px;height:32px;padding:7px;border-radius:8px;background:var(--prib);color:var(--pri)}
.card h3>.ic:first-child{color:var(--pri)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:8px;padding:12px 14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:24px;line-height:1.25;color:var(--pri)}.stat span{color:var(--mut);font-size:12.5px}
.stat.w{border-left-color:var(--acc)}.stat.w b{color:var(--warn)}.stat.e{border-left-color:var(--err)}.stat.e b{color:var(--err)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border:1px solid var(--grid);text-align:left;vertical-align:top}
th{background:#f1f3f5;color:#344054;font-weight:600;position:sticky;top:0;z-index:1;white-space:nowrap;box-shadow:0 1px 0 #cfd5dc}
tr:nth-child(even) td{background:#fafbfc}tr:hover td{background:var(--prib)}
.tw{overflow:auto;max-height:540px;border:1px solid var(--line);border-radius:8px;background:#fff}
.num{text-align:right;font-variant-numeric:tabular-nums}
button.b,label.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--pri);color:#fff;border:1px solid var(--pri);border-radius:7px;padding:8px 15px;font:inherit;font-weight:600;cursor:pointer;min-height:38px;box-shadow:var(--sh);transition:background .15s,transform .05s}
button.b:hover,label.b:hover{background:var(--pri2)}button.b:active{transform:translateY(1px)}button.b:disabled{opacity:.45;cursor:not-allowed}
button.b.s,label.b.s{background:#fff;color:var(--pri);border-color:#b7c9bf}button.b.s:hover,label.b.s:hover{background:var(--prib)}
button.b.r{background:var(--err);border-color:var(--err)}button.b.a{background:var(--acc);border-color:var(--acc)}
header button.b.s{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35);min-height:36px;box-shadow:none}
header button.b.s:hover{background:rgba(255,255,255,.28)}
input,select,textarea{font:inherit;padding:7px 10px;border:1px solid #c8cfd6;border-radius:7px;background:#fff;color:var(--ink);max-width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px rgba(16,124,65,.18)}
input:disabled,select:disabled,textarea:disabled{background:#f4f5f7;color:#667085}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
td input,td select{width:100%;min-width:70px;border-color:transparent;background:transparent;border-radius:3px;padding:5px 6px}
td input:not(:disabled):hover,td select:not(:disabled):hover{border-color:#c8cfd6}
td input:focus,td select:focus{background:#fff;border-color:var(--pri)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.row>div{display:flex;flex-direction:column;gap:4px}.row label{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:5px;font-weight:600}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:var(--prib);color:var(--pri2);white-space:nowrap;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.err{background:var(--errbg);color:var(--err)}
.msg{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:8px;margin:6px 0;font-size:13.5px;border-left:4px solid transparent}
.msg.warn{background:var(--warnbg);color:#6b4100;border-color:var(--acc)}.msg.err{background:var(--errbg);color:var(--err);border-color:var(--err)}.msg.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.msg.info{background:#e7f1fb;color:#1b4f80;border-color:#3b82c4}
.bar{height:10px;background:#e3e9f0;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}.bar i.o{background:var(--err)}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.55);backdrop-filter:blur(2px);display:none;z-index:20;overflow:auto;padding:14px}
.modal.on{display:block}.modal .in{background:var(--bg);max-width:1100px;margin:0 auto;border-radius:14px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.split{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:700px){.split{grid-template-columns:1fr}main{padding:10px}header{padding:10px}.bt small{display:none}nav button{padding:9px 11px}.hf select,.hf input{max-width:130px}}
small,.mut{color:var(--mut)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:11px 18px;border-radius:10px;display:none;z-index:50;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3);border-left:4px solid #34d399}
@media print{header,nav,.noprint,button{display:none!important}.card{border:0;box-shadow:none}.tw{max-height:none;overflow:visible}}
body.locked header,body.locked nav,body.locked main{display:none}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#e7f3ec,#f1f3f5 60%);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
body.locked #login{display:flex}
#login .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:380px;text-align:center;box-shadow:0 12px 40px rgba(16,24,40,.15)}
#login .lk{width:60px;height:60px;border-radius:16px;background:var(--pri);color:#fff;display:grid;place-items:center;margin:0 auto 8px}#login .lk .ic{width:28px;height:28px}
#login .box input{width:100%;margin-bottom:10px;padding:10px 12px}#login .err{color:var(--err);background:var(--errbg);border-radius:8px;padding:8px;margin-bottom:10px;display:none}
.seg{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#e3e9f0;margin-bottom:3px}.seg i{display:block;height:100%}.s-done{background:var(--ok)}.s-staff{background:var(--pri)}.s-cvc{background:var(--acc)}.s-cant{background:var(--err)}.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:3px;vertical-align:middle}
.ic{pointer-events:none}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.xp{border-color:#b7c9bf}
.xl{display:flex;flex-direction:column;gap:4px;margin:6px 0 10px;max-height:150px;overflow:auto}
.xj{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;cursor:pointer;font:inherit}.xj:hover{background:var(--errbg)}
.xs{border:1px solid #c8cfd6;background:#fff;border-radius:8px 8px 0 0;overflow:auto;max-height:68vh;padding:0}
.xs table{border-collapse:collapse;table-layout:fixed;width:auto;font-size:11pt;font-family:'Noto Sans Khmer','Inter',sans-serif}
.xs table td,.xs table tr:nth-child(even) td,.xs table tr:hover td{padding:0 3px;border:0;background:#fff;overflow:hidden;line-height:1.2;vertical-align:bottom;color:#000}
.xs td.xok{outline:2px solid #1b7f4b;outline-offset:-2px}
.xs td.xbad,.xs table tr td.xbad{background:#fecaca!important;outline:2px solid #dc2626;outline-offset:-2px;color:#991b1b;font-weight:700}
.xs td.xflash{animation:xf 1.4s 2}@keyframes xf{50%{box-shadow:inset 0 0 0 4px #f59e0b}}
.xtabs{display:flex;gap:2px;overflow-x:auto;background:#e9ecef;border:1px solid #c8cfd6;border-top:0;border-radius:0 0 8px 8px;padding:4px 6px}
.xt{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:4px;background:var(--tc);color:#111;padding:5px 14px;font:inherit;cursor:pointer;white-space:nowrap}
.xt:hover{filter:brightness(.95)}
.xt.on{font-weight:700;text-decoration:underline;box-shadow:inset 0 -3px 0 var(--pri),0 1px 3px rgba(0,0,0,.2);background-image:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.45))}
.xb{background:#dc2626;color:#fff;border-radius:99px;font-style:normal;font-size:11px;min-width:18px;padding:0 5px;text-align:center}
.xk{color:#0b5a2f;display:inline-flex}
</style>

function toISO(v){if(v==null||v==='')return null;if(v instanceof Date){if(isNaN(v))return null;return new Date(v.getTime()+12*36e5).toISOString().slice(0,10)}
 if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
 const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
 m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
 m=s.match(/^(\d{1,2})[ -]([A-Za-z]{3})[a-z]*[ -,]*(\d{4})/);if(m){const mi='jan feb mar apr may jun jul aug sep oct nov dec'.split(' ').indexOf(m[2].toLowerCase());if(mi>=0)return m[3]+'-'+String(mi+1).padStart(2,'0')+'-'+m[1].padStart(2,'0')}return null}
const cleanVillage=v=>{v=String(v==null?'':v).trim();return /^BX\d{4}\s*-/i.test(v)?v.replace(/\s*-\s*/g,'-'):v};
const IMP={rate:null,res:null,skip:new Set()};
function gnEntriesOf(cid,rc){const raw=DASH.gn[cid]||{};
 const cor=Object.entries((DASH.corr&&DASH.corr[cid])||{}).map(([k,v])=>({k,v:v||{}})).filter(x=>/^\s*GN\b/i.test(x.v.Type||'')&&!/closed/i.test(x.v.Status||''));
 const ents=Object.entries(raw).filter(([k,e])=>e&&/^open$/i.test(String(e.Status||'').trim())).map(([k,e])=>{
  const id=String(e.CorrespondenceId||e.OrderNumber||k).trim();const m=e.CorrespondenceId?cor.find(x=>String(x.v.CorrespondenceId||x.k).trim()===String(e.CorrespondenceId).trim()):null;
  return{key:rc+'|'+id,order:String(e.OrderNumber||''),corrId:String(e.CorrespondenceId||''),date:toISO(e.Date),due:m?toISO(m.v.Due):null,cur:String(e.GNAmountCurrency||'USD').toUpperCase(),
   total:e.GNAmount!=null?Number(e.GNAmount):null,community:e.CommunityAmount!=null?Number(e.CommunityAmount):null,child:e.ChildFamilyAmount!=null?Number(e.ChildFamilyAmount):null,_e:e}});
 const un=ents.filter(x=>!x.due);
 if(un.length){const dues=cor.map(x=>toISO(x.v.Due)).filter(Boolean).sort();const used=new Set(ents.map(x=>x.due).filter(Boolean));const free=dues.filter(d=>!used.has(d));
  if(free.length===un.length){un.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));un.forEach((x,i)=>{x.due=free[i];x.dueGuess=true})}else if(dues.length)un.forEach(x=>{x.due=dues[0];x.dueGuess=true})}
 return ents.sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')))}
function newSum(rec,f){return rec.entries.filter(x=>x.isNew&&!IMP.skip.has(x.key)).reduce((s,x)=>s+(Number(x[f])||0),0)}
function validateDash(){if(!DASH.idx||!DASH.gn)return null;
 const issues=[],add=(sev,rc,msg,row)=>issues.push({sev,rc,msg,row:row||'',src:'D'});
 const merged=[],openIds=new Set();let notOpen=0;
 for(const cid in DASH.gn){const rc=String(cid).trim().toUpperCase();const ents=gnEntriesOf(cid,rc);if(!ents.length){notOpen++;continue}openIds.add(rc);
  const rec={rcId:rc,entries:ents,orig:{source:'MBR2 dashboard',orders:ents.map(x=>x.order||x.corrId)}};let ok=true;
  if(!RCRE.test(rc))add('warn',rc,'Unusual RC ID format');
  ents.forEach(x=>{const lbl='GN '+(x.order||x.corrId||x.date||'');const known=S.gn[x.key];x.isNew=!known;
   if(x.cur!=='USD'){ok=false;add('err',rc,lbl+': amount is not in USD ('+x.cur+')')}
   if(x.total==null||x.total<=0){ok=false;add('err',rc,lbl+': missing or zero GN amount')}
   else if(x.community!=null&&x.child!=null&&Math.abs(x.community+x.child-x.total)>0.005)add('warn',rc,`${lbl}: Community ${x.community} + Child ${x.child} ≠ Total ${x.total}`);
   if(!x.date)add('warn',rc,lbl+': no GN date');
   if(!x.due)add('warn',rc,lbl+': no open GN correspondence with a due date');else if(x.dueGuess)add('warn',rc,lbl+': due date matched by order (please check)');
   if(known&&(known.total!==x.total||known.child!==x.child&&x.child!=null||known.community!==x.community&&x.community!=null)){x.changed=true;add('warn',rc,`${lbl}: dashboard amount differs from the recorded one (${known.child} vs ${x.child}) – ${gnProgress(rc)?'recorded amount kept (work already started)':'will be updated'}`)}});
  const nNew=ents.filter(x=>x.isNew).length;rec.nNew=nNew;
  if(ents.length>1)add('warn',rc,`DUPLICATED RC: ${ents.length} open GNs (${nNew} new, ${ents.length-nNew} already tracked). Each GN is tracked separately – old budgets are never reused. Tick any GN already processed outside this app.`);
  if(S.gn[rc+'|legacy']&&nNew)add('warn',rc,'Imported earlier as one combined budget – it will be replaced by the separate GNs. Tick the GNs that were already processed.');
  gnOf(rc).filter(g=>!g.legacy&&!ents.some(x=>x.key===g.key)&&!g.gone).forEach(g=>add('warn',rc,`GN ${g.order||g.corrId||g.date} is no longer open in the dashboard – ${gnProgress(rc)?'kept (work already started)':'will be closed'}`));
  const e0=ents[0]._e,dc=dChild(rc);rec.nameKh='';rec.nameEn=String(e0.ChildName||'').trim();rec.gender='';rec.age='';rec.gnType='GN';rec.sponsor='';rec.village=dNormVillage(e0.Community)||cleanVillage(e0.Community);
  if(dc){if(dc.nameKh)rec.nameKh=dc.nameKh;if(dc.nameEn&&!rec.nameEn)rec.nameEn=dc.nameEn;rec.gender=dc.gender||'';rec.age=dc.age||'';rec.sponsor=dc.sponsorKh||'';if(dc.villageKh){rec.villageCsv=rec.village;rec.village=dc.villageKh}rec.khSrc='dashboard';
   if(!dc.nameKh)add('warn',rc,'MBR2 dashboard has no Khmer name for this child')}
  else add('warn',rc,'RC ID not found in the dashboard roster (no Khmer name / village / CVC)');
  if(!rec.village)add('warn',rc,'Missing village (CVC cannot be assigned)');
  rec.ok=ok;merged.push(rec)}
 merged.sort((x,y)=>x.rcId<y.rcId?-1:1);

function ensureState(){S.gn=S.gn||{};S.hist=S.hist||{};S.memos=S.memos||[];S.memoSeq=S.memoSeq||0;
 for(const rc in S.children){if(gnOf(rc).length)continue;const c=S.children[rc];if(c.total==null)continue;
  S.gn[rc+'|legacy']={key:rc+'|legacy',rc,order:'',corrId:'',date:c.gnLast||'',due:c.due||'',total:c.total,community:c.community,child:c.child!=null?c.child:c.total,rate:c.rate||S.rate,cantParts:[],legacy:true,note:(c.gnCount>1?'combined '+c.gnCount+' GNs; ':'')+'imported before per-GN tracking'}}}
function FYOF(iso){const m=/^(\d{4})-(\d{2})/.exec(iso||'');return m?'FY'+String((+m[1]+(+m[2]>=10?1:0))%100).padStart(2,'0'):''}
function gnOf(rc){return Object.values(S.gn).filter(g=>g.rc===rc).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||a.key.localeCompare(b.key))}
function gnLimit(g){return (g.child!=null?g.child:(g.total||0))*(g.rate||S.rate)}
function manualCant(g){return (g.cantParts||[]).reduce((s,x)=>s+(+x.khr||0),0)}
function subLines(rc){const o=[];(S.hist[rc]||[]).forEach(r=>r.lines.forEach(l=>o.push(l)));return o}
function gnProgress(rc){return subLines(rc).length>0||gnOf(rc).some(g=>(g.cantParts||[]).length)}
const GST={done:['Done','បានទិញរួចរាល់','ok'],pending_staff:['Pending staff processing','រង់ចាំបុគ្គលិកដំណើរការ',''],pending_cvc:['Pending CVC proposal','រង់ចាំ CVC រៀបចំសំណើ','warn'],cant:["Can't process",'មិនអាចដំណើរការបាន','err'],partial:['Partly processed','ដំណើរការមួយផ្នែក','warn'],prior:['Done before this app','ដំណើរការរួចមុនប្រព័ន្ធនេះ','ok'],gone:['Closed in Horizon','បិទក្នុង Horizon',''],released:['Released to CVC','ត្រឡប់ទៅ CVC វិញ','warn']};
function gstTag(k){const x=GST[k]||GST.partial;return `<span class="tag ${x[2]}">${esc(t(x[0],x[1]))}</span>`}
function gnState(p){const v=[['done',p.done],['pending_staff',p.staff],['pending_cvc',p.cvc],['cant',p.cant]].filter(x=>x[1]>0.5);return v.length===1?v[0][0]:v.length?'partial':'pending_cvc'}
/* Splits every item amount over the child's GN entries, oldest GN first. noCur=true ignores the request being prepared now. */
function gnParts(rc,noCur){const c=S.children[rc];const P=gnOf(rc).filter(g=>!g.prior&&!g.gone).map(g=>({g,limit:gnLimit(g),done:0,staff:0,cvc:0,cant:Math.min(gnLimit(g),manualCant(g))}));let over=0;
 const feed=(l,k)=>{let a=lineTotal(l);for(const p of P){if(a<=0.0001)break;const cap=p.limit-p.done-p.staff-p.cant;if(cap<=0.0001)continue;const x=Math.min(cap,a);p[k]+=x;a-=x}over+=Math.max(0,a)};
 subLines(rc).forEach(l=>{if(l.ps==='released')return;feed(l,l.ps==='done'?'done':l.ps==='cant'?'cant':'staff')});
 if(!noCur&&c&&STATUSES.indexOf(c.status)>=STATUSES.indexOf('Submitted by CVC'))getReq(rc).lines.forEach(l=>feed(l,'staff'));
 P.forEach(p=>{p.cvc=Math.max(0,p.limit-p.done-p.staff-p.cant);p.state=gnState(p)});return{P,over}}
function poolKHR(rc){return gnParts(rc,true).P.reduce((s,p)=>s+p.cvc,0)}   /* budget still free for a NEW request: old / processed GN budget is already used up */
const pBudget=c=>poolKHR(c.rcId)/(c.rate||S.rate);
const itemKey=l=>String(l.cat||'')+'|'+norm(l.name).replace(/\s+/g,'');
function prevItem(rc,l){if(!l.name)return null;const k=itemKey(l),sc=S.ui.dupScope||'fy',fy=FYOF(new Date().toISOString().slice(0,10));
 for(const r of (S.hist[rc]||[])){if(sc==='fy'&&FYOF(r.memoAt)!==fy)continue;for(const x of r.lines){if(x.ps==='released'||x.ps==='cant')continue;if(itemKey(x)===k)return{memoId:r.memoId,at:r.memoAt,ps:x.ps}}}return null}
function refreshChild(rc){const c=S.children[rc];if(!c)return;const all=gnOf(rc).filter(g=>!g.prior&&!g.gone);if(!all.length)return;const {P}=gnParts(rc,true);
 const act=P.filter(p=>p.state!=='done'&&p.state!=='cant'&&p.limit>0.5).map(p=>p.g);const use=act.length?act:all;
 const sm=f=>use.some(g=>g[f]!=null)?use.reduce((s,g)=>s+(Number(g[f])||0),0):null;
 c.total=sm('total');c.community=sm('community');c.child=sm('child');c.gnCount=act.length;
 const dues=act.map(g=>g.due).filter(Boolean).sort();c.due=dues[0]||c.due||null;
 const ds=gnOf(rc).map(g=>g.date).filter(Boolean).sort();c.gnLast=ds[ds.length-1]||c.gnLast||'';
 if(act.length)c.rate=act[act.length-1].rate||c.rate;
 const fy=FYOF(c.gnLast);c.gnFY=fy;c.gnYear=gnOf(rc).filter(g=>!g.legacy&&FYOF(g.date)===fy).length}
function syncStatus(rc){const c=S.children[rc];if(!c||!['Purchasing in Progress','Purchased'].includes(c.status))return;const pool=poolKHR(rc),pend=subLines(rc).some(l=>l.ps==='staff');
 c.status=pool>0.5?'Published to CVC':pend?'Purchasing in Progress':'Purchased'}
function ledger(rc){const c=S.children[rc],r=getReq(rc);const rate=c.rate||S.rate;const limit=poolKHR(rc);const req=r.lines.reduce((s,l)=>s+lineTotal(l),0);
 const warns=[];const seen={};r.lines.forEach((l,i)=>{if(!(Number(l.qty)>0))warns.push(`Line ${i+1}: quantity is zero`);if(!(Number(l.price)>0))warns.push(`Line ${i+1}: missing price`);if(!l.name)warns.push(`Line ${i+1}: no item name`);const k=l.cat+'|'+norm(l.name);if(l.name&&seen[k])warns.push(`Line ${i+1}: duplicate selection "${l.name}"`);seen[k]=1});
 const dups=[];r.lines.forEach((l,i)=>{const p=prevItem(rc,l);if(p){const ok=!!l.dupOk;dups.push({i,ok,name:l.name,...p});if(!ok)warns.push(`Line ${i+1}: "${l.name}" is already in memo ${p.memoId} (${p.at}) – the same item cannot go into a new memo`)}});
 if(c.community!=null&&c.child!=null&&c.total!=null&&Math.abs(c.community+c.child-c.total)>.005)warns.push('Imported community + child allocation does not equal total budget');
 return{rate,limit,req,rem:limit-req,over:req>limit+0.5,warns,dups,limitCommunity:(c.community||0)*rate,limitChild:limit}}
function dupUI(L){return L.dups.filter(d=>!d.ok&&EXC_ROLES.includes(role())).map(d=>`<div class="msg info">${esc(t('Approver: allow the repeat of','អ្នកអនុម័ត៖ អនុញ្ញាតឱ្យទិញម្តងទៀត'))} “${esc(d.name)}” (line ${d.i+1}) <button class="b s" style="min-height:0;padding:4px 10px" onclick="allowDup(${d.i})">${esc(t('Allow with reason','អនុញ្ញាត + មូលហេតុ'))}</button></div>`).join('')}

function delLine(i){getReq(CUR).lines.splice(i,1);save();openChild(CUR)}
function wireLines(){document.querySelectorAll('#lt [data-k]').forEach(el=>{const h=()=>{const l=getReq(CUR).lines[el.dataset.i];l[el.dataset.k]=el.value;if(el.dataset.k==='name'){const it=S.items.find(x=>x.cat===l.cat&&x.name===el.value);if(it){if(it.unit&&!l.unit)l.unit=it.unit;if(it.price&&!l.price)l.price=it.price;if(it.supplier&&!l.supplier)l.supplier=it.supplier}}

function recalc(){const c=S.children[CUR];if(!c)return;const r=getReq(CUR),L=ledger(CUR);const pct=L.limit?Math.min(100,L.req/L.limit*100):0;
 $('#tot').innerHTML=`<b style="color:${L.over?'var(--err)':'var(--pri)'}">${khr(L.rem)}</b><span>${esc(t('Remaining','នៅសល់'))} · ${esc(t('requested','ស្នើ'))} ${khr(L.req)} (${usd(L.req/L.rate)})</span>`;
 const bf=$('#barfill');bf.style.width=pct+'%';bf.className=L.over?'o':'';

 $('#warns').innerHTML=(L.over?`<div class="msg err">${ic('alert')} ${esc(t('Over the approved limit by','លើសថវិកាអនុម័ត'))} ${khr(L.req-L.limit)}</div>`:'')+L.warns.map(w=>`<div class="msg warn">${esc(w)}</div>`).join('')+(r.exc?`<div class="msg info">${esc(t('Exception recorded','បានកត់ត្រាការអនុញ្ញាតពិសេស'))}: ${esc(r.exc.reason)} — ${esc(r.exc.by)} (${esc(r.exc.role)})</div>`:'');

 $('#exc').innerHTML=L.over&&EXC_ROLES.includes(role())&&!r.exc?`<div class="card"><h3>${ic('alert')}${esc(t('Over-budget exception','ការអនុញ្ញាតពិសេសលើសថវិកា'))}</h3><div class="row"><div style="flex:1"><label>${esc(t('Reason (required)','មូលហេតុ (ចាំបាច់)'))}</label><input id="excr" style="width:100%"></div><button class="b a" onclick="recExc()">${esc(t('Record exception','កត់ត្រា'))}</button></div></div>`:'';
 const st=c.status,trs=(TR[st]||[]).filter(x=>x.r.includes(role()));
 $('#acts').innerHTML=trs.map((x,i)=>`<div>${x.kind==='return'||x.kind==='reject'?`<input id="rs${i}" placeholder="${esc(t('Reason (required)','មូលហេតុ (ចាំបាច់)'))}" style="margin-bottom:4px;display:block">`:''}<button class="b ${x.kind==='reject'?'r':x.kind==='draft'?'s':''}" onclick="act(${i})">${esc(t(x.l,x.k))}</button></div>`).join('')||`<div class="mut">${esc(role()==='aud'?t('Read-only role','តួនាទីមើលតែប៉ុណ្ណោះ'):t('No action available for your role at this status','គ្មានសកម្មភាពសម្រាប់តួនាទីអ្នកក្នុងស្ថានភាពនេះ'))}</div>`}
function act(i){const c=S.children[CUR];const trs=(TR[c.status]||[]).filter(x=>x.r.includes(role()));const x=trs[i];let reason='';if(x.kind==='return'||x.kind==='reject'){reason=($('#rs'+i).value||'').trim();if(!reason)return toast(t('Reason is required','ត្រូវការមូលហេតុ'))}doTransition(CUR,x,reason)}

<script>
/* ===== Finance workbook builder: fills the 5-sheet template (Advance-Print, Summary-Print, GNCA, GN Received List, Culculation Sheet) ===== */
const FIN={
 CAP:23,                       // children per workbook (rows available in GNCA / Culculation Sheet form)
 MAXITEMS:10,                  // item lines per child on Advance-Print
 CATS:['Bicycle /កង់','Rice / អង្ករផ្កាខ្ញី','Rice / អង្ករនាងខុន','Study Material/សំភារៈសិក្សា','Clothes/សំលៀកបំពាក់','Food/ Ingredient-អាហារ/គ្រឿងផ្សំ','Household Materials/សំភារៈក្នុងផ្ទះ','Construction Materials/សំភារៈសំណង់','Other Materials/សម្ភារៈផ្សេងៗ'],
 SHEETS:{ap:'xl/worksheets/sheet1.xml',sum:'xl/worksheets/sheet2.xml',gnca:'xl/worksheets/sheet3.xml',rl:'xl/worksheets/sheet4.xml',cs:'xl/worksheets/sheet5.xml'}
};
FIN.serial=function(iso){ if(!iso)return null; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso)); if(!m)return null; return Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-Date.UTC(1899,11,30))/86400000) };
FIN.colNum=function(ref){const s=/^[A-Z]+/.exec(ref)[0];let n=0;for(const ch of s)n=n*26+ch.charCodeAt(0)-64;return n};
FIN.colName=function(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
FIN.NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';

/* Patcher: edits cells of one worksheet XML in place (styles, merges, formulas, images etc. stay byte-for-byte) */
FIN.patcher=function(xml){
 const doc=new DOMParser().parseFromString(xml,'application/xml');
 const sd=doc.getElementsByTagName('sheetData')[0];
 const rows=new Map();
 for(let n=sd.firstChild;n;n=n.nextSibling) if(n.nodeType===1&&n.nodeName==='row') rows.set(+n.getAttribute('r'),n);
 const cellIdx=new Map();
 function cell(ref){
  if(cellIdx.has(ref))return cellIdx.get(ref);
  const rn=+/\d+/.exec(ref)[0],cn=FIN.colNum(ref);let row=rows.get(rn);

/* validation: returns list of human-readable problems (empty = OK) */
FIN.validate=function(children){
 const P=[];
 children.forEach(c=>{
  const who=c.rcId+' '+(c.nameKh||c.nameEn||'');
  if(!/^CAM-\d+-\d+/i.test(c.rcId||''))P.push(who+': RC ID format not recognised');
  if(!(c.lines&&c.lines.length))P.push(who+': no purchasing items');
  if((c.lines||[]).length>FIN.MAXITEMS)P.push(who+': '+c.lines.length+' items – the Advance-Print form holds '+FIN.MAXITEMS+' per child');
  (c.lines||[]).forEach((l,i)=>{
   if(!FIN.CATS.includes(l.cat))P.push(who+' item '+(i+1)+': category "'+l.cat+'" is not one of the 9 Summary-Print categories');
   if(!(+l.qty>0)||!(+l.price>0)||!l.name)P.push(who+' item '+(i+1)+': name / quantity / price missing');
  });
 });
 return P;
};

/* main: data = {needBy:'YYYY-MM-DD', buyDate:'YYYY-MM-DD', children:[{rcId,nameKh,nameEn,village,total,community,child,due,phone,sponsor,lines:[{cat,name,spec,qty,unit,price,supplier}]}]}  (max FIN.CAP) */
FIN.build=async function(templateB64,data){
 const ch=data.children; if(ch.length>FIN.CAP)throw new Error('Too many children for one workbook (max '+FIN.CAP+')');
 const zip=await JSZip.loadAsync(templateB64,{base64:true});
 const P={}; for(const k in FIN.SHEETS) P[k]=FIN.patcher(await zip.file(FIN.SHEETS[k]).async('string'));
 const txt=(v)=>String(v==null?'':v);
 /* ---- GNCA ---- */
 ch.forEach((c,i)=>{ const r=4+i,g=P.gnca,pr=/CAM-(\d+)-/i.exec(c.rcId);
  g.str('B'+r,pr?'C'+pr[1]:'C'); g.str('D'+r,c.rcId);
  if(c.nameKh)g.str('E'+r,c.nameKh); if(c.nameEn)g.str('F'+r,c.nameEn); if(c.village)g.str('G'+r,c.village);   /* empty ones keep the template's blank formula */
  g.num('H'+r,c.total); g.num('I'+r,c.community); g.num('J'+r,c.child); const d=FIN.serial(c.due); if(d)g.num('K'+r,d); if(c.phone)g.str('L'+r,c.phone) });
 /* ---- Advance-Print ---- */
 const ap=P.ap; if(data.staff)ap.str('A383',data.staff); const nb=FIN.serial(data.needBy),bd=FIN.serial(data.buyDate);
 if(nb)ap.num('B5',nb); if(bd)ap.num('B6',bd);
 ch.forEach((c,i)=>{ const r=8+14*i;
  c.lines.forEach((l,j)=>{ const x=r+1+j; ap.str('B'+x,txt(l.name)+(l.spec?' ('+l.spec+')':'')); ap.str('C'+x,l.cat); ap.num('D'+x,+l.qty); ap.str('E'+x,l.unit||''); ap.num('F'+x,+l.price) });
  if(c.sponsor)ap.str('C'+(r+13),c.sponsor) });
 /* ---- GN Received List: only the child's RC ID / name / village are filled (formulas from GNCA). Items are left BLANK on purpose – completed by hand at distribution. ---- */
 /* ---- Culculation Sheet: supplier amounts (only when suppliers were entered on the request lines) ---- */
 const usedCols=new Set(); const all=[].concat(...ch.map(c=>c.lines)); const tmplProv=data.provisionSupplier||'';
 if(all.some(l=>(l.supplier||'').trim())){
  const names=[]; all.forEach(l=>{const s=(l.supplier||'').trim()||'(no supplier)'; if(s!==tmplProv&&!names.includes(s))names.push(s)});
  const cols=[]; for(let n=6;n<=23;n++) if(n!==10) cols.push(FIN.colName(n)); // F..W except J (ProVision supplier)
  if(names.length>cols.length)throw new Error('More than '+cols.length+' different suppliers – the Culculation Sheet has 18 supplier columns');
  const colOf={}; names.forEach((s,k)=>colOf[s]=cols[k]); if(tmplProv)colOf[tmplProv]='J';
  cols.forEach((cl,k)=>{ P.cs.str(cl+'3',names[k]||'') }); if(tmplProv)P.cs.str('J3',tmplProv);
  ch.forEach((c,i)=>{ const r=4+i,sum={}; c.lines.forEach(l=>{const s=(l.supplier||'').trim()||'(no supplier)'; sum[s]=(sum[s]||0)+(+l.qty)*(+l.price)});
   for(const s in sum){ P.cs.num(colOf[s]+r,sum[s]); usedCols.add(colOf[s]) } });
 }
 await FIN.layout(P,ch,data,zip,usedCols);
 for(const k in FIN.SHEETS) zip.file(FIN.SHEETS[k],P[k].out());

};

/* ===== Layout: hides every blank child / blank item row, removes filters, sets A4 print areas, page breaks and footers ===== */
